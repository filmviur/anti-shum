<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#15110d">
    <title>Анти-Шум · Нет соединения</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
            color:#e7d4b8;background:radial-gradient(circle at 50% 18%,rgba(117,83,45,.22),transparent 42%),linear-gradient(145deg,#0d0b09,#18120e 55%,#0b0a08);
            font-family:Georgia,"Times New Roman",serif}
        .card{width:min(430px,100%);padding:36px 27px;text-align:center;
            border:1px solid rgba(205,170,110,.38);border-radius:9px;background:linear-gradient(150deg,#392919,#17120f 83%);
            box-shadow:0 18px 70px rgba(0,0,0,.48)}
        .ornament{font-size:33px;color:#d9b77e;margin:0 0 8px}
        .brand{font:600 14px Georgia,serif;letter-spacing:.16em;color:#c9a96d;margin:0 0 16px}
        h1{margin:0 0 16px;font:600 33px/1.2 Georgia,serif;color:#ead09e}
        p{font-size:15px;line-height:1.7;color:#c5b199;margin:0 0 16px}
        button{display:block;width:100%;min-height:46px;padding:11px 18px;margin:22px 0 0;cursor:pointer;
            border:1px solid rgba(219,180,119,.48);border-radius:5px;background:#4d3724;color:#f0d8aa;font:600 15px Georgia,serif}
        .note{font-size:12px;margin:15px 0 0;color:#ad967b}
        @media(max-width:480px){.card{padding:29px 20px}h1{font-size:29px}}
    </style>
</head>
<body>
    <main class="card">
        <div class="ornament" aria-hidden="true">✦</div>
        <p class="brand">АНТИ-ШУМ</p>
        <h1>Тишина без связи</h1>
        <p>Кажется, интернет сделал паузу. Твоё тихое пространство никуда не исчезло.</p>
        <p>Если ты писал ответ, сохранённый черновик останется на этом устройстве. После восстановления сети мы вернём тебя к сайту.</p>
        <button id="retry" type="button">Попробовать снова</button>
        <p class="note" id="status" role="status" aria-live="polite">Ждём возвращения соединения…</p>
    </main>
    <script>
        const status=document.getElementById("status");
        function retry(){
            status.textContent="Проверяем соединение…";
            window.location.reload();
        }
        document.getElementById("retry").addEventListener("click",retry);
        window.addEventListener("online",function(){
            status.textContent="Связь вернулась. Открываем «Анти-Шум»…";
            window.setTimeout(retry,350);
        });
    </script>
</body>
</html>
