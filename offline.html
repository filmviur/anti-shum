<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15110d">
<title>Анти-Шум · Тишина без связи</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 padding:20px;color:#e7d4b8;background:radial-gradient(circle at 50% 22%,rgba(117,83,45,.21),transparent 43%),linear-gradient(145deg,#0d0b09,#18120e 55%,#0b0a08);
 font-family:Georgia,"Times New Roman",serif}
.card{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px 24px 17px;text-align:center;
 border:1px solid rgba(205,170,110,.38);border-radius:9px;background:linear-gradient(150deg,#392919,#17120f 83%);
 box-shadow:0 18px 70px rgba(0,0,0,.48);animation:appear .6s ease-out}
.brand{font:600 14px Georgia,serif;letter-spacing:.16em;color:#c9a96d;margin:0 0 9px}
.scene{position:relative;isolation:isolate;aspect-ratio:4/3;width:min(340px,100%);margin:-10px auto 6px;pointer-events:none}
.scene:before{content:"";position:absolute;left:34%;top:17%;width:43%;height:47%;border-radius:50%;
 background:radial-gradient(circle,rgba(255,190,82,.5),rgba(255,179,76,.08) 50%,transparent 75%);
 filter:blur(14px);animation:glow 4s ease-in-out infinite}
.scene:after{content:"";position:absolute;left:20%;bottom:7%;width:65%;height:18%;
 background:radial-gradient(ellipse,rgba(255,188,78,.27),transparent 70%);
 animation:sea 4s ease-in-out infinite;mix-blend-mode:screen}
.scene img{position:relative;display:block;width:100%;height:100%;object-fit:contain;
 filter:brightness(.84) saturate(.89);animation:drift 6s ease-in-out infinite}
h1{margin:0 0 12px;font:600 33px/1.2 Georgia,serif;color:#ead09e}
p{font-size:15px;line-height:1.62;color:#c5b199;margin:0 0 12px}
button{display:block;width:100%;min-height:46px;padding:11px 18px;margin:15px 0 0;cursor:pointer;
 border:1px solid rgba(219,180,119,.48);border-radius:5px;background:#4d3724;color:#f0d8aa;font:600 15px Georgia,serif}
.note{font-size:12px;margin:11px 0 0;color:#c9ae81;min-height:19px}
.reconnected .scene img{animation:wake 1.35s ease-out both;filter:brightness(1.19) saturate(1.12) drop-shadow(0 0 16px rgba(255,195,91,.5))}
.reconnected .scene:before{animation:flare 1.35s ease-out both}
.reconnected button{visibility:hidden}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.42;transform:scale(.94)}50%{opacity:.95;transform:scale(1.15)}}
@keyframes sea{0%,100%{opacity:.32;transform:translateX(-3px)}50%{opacity:.8;transform:translateX(4px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wake{0%{transform:scale(.98)}60%{transform:scale(1.04);filter:brightness(1.36) drop-shadow(0 0 24px rgba(255,195,91,.6))}100%{transform:none}}
@keyframes flare{0%{opacity:.5;transform:scale(.9)}55%{opacity:1;transform:scale(1.65)}100%{opacity:.7;transform:scale(1.2)}}
@media(max-width:480px){.card{padding:16px 17px}.scene{width:min(275px,100%)}h1{font-size:29px}}
@media(max-height:660px){.scene{width:min(205px,100%)}.card{padding:12px 17px}}
@media(prefers-reduced-motion:reduce){.card,.scene:before,.scene:after,.scene img,.reconnected .scene img,.reconnected .scene:before{animation:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
 <p class="brand">АНТИ-ШУМ</p>
 <div class="scene" aria-hidden="true"><img src="./offline-lighthouse.webp" width="800" height="600" alt=""></div>
 <h1 id="title">Тишина без связи</h1>
 <p>Кажется, интернет сделал паузу. Твоё тихое пространство никуда не исчезло.</p>
 <p>Если ты писал ответ, сохранённый черновик останется на этом устройстве. После восстановления сети мы вернём тебя к сайту.</p>
 <button id="retry" type="button">Проверить соединение</button>
 <p class="note" id="status" role="status" aria-live="polite">Свет маяка ждёт возвращения связи…</p>
</main>
<script>
"use strict";
const statusNode=document.getElementById("status");
const titleNode=document.getElementById("title");
let checking=false,restored=false;
async function checkConnection(){
 if(checking||restored||!navigator.onLine)return;
 checking=true;
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),4500);
 statusNode.textContent="Ищем сигнал…";
 try{
  // A non-navigation request never uses the SW navigation fallback.
  const response=await fetch("./offline.html?check="+Date.now(),{cache:"no-store",signal:controller.signal});
  if(!response.ok||!navigator.onLine)throw new Error("Still offline");
  restored=true;
  document.getElementById("card").classList.add("reconnected");
  titleNode.textContent="Связь восстановлена ✨";
  statusNode.textContent="Маяк снова светит. Открываем «Анти-Шум»…";
  setTimeout(()=>location.reload(),1500);
 }catch(e){
  statusNode.textContent="Ждём соединения. Твой черновик остаётся на устройстве.";
 }finally{clearTimeout(timeout);checking=false}
}
document.getElementById("retry").addEventListener("click",checkConnection);
window.addEventListener("online",checkConnection);
setInterval(()=>{if(!document.hidden)checkConnection()},5500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkConnection()});
if(navigator.onLine)checkConnection();
</script>
</body>
</html>
