<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анти-Шум</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(89, 55, 180, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 150, 180, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #090914,
                    #111126 50%,
                    #07151c
                );

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 15px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .time {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 15px;
        }

        .question {
            font-size: 26px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .answer-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
        }

        .answer-input {
            width: 100%;
            min-height: 150px;
            resize: vertical;

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;

            padding: 20px 62px 42px 20px;

            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.5;

            color: #ffffff;
            background: rgba(255, 255, 255, 0.045);

            outline: none;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .answer-input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .answer-input:focus {
            border-color: rgba(140, 105, 255, 0.50);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 25px rgba(118, 87, 255, 0.12);
        }

        .answer-counter {
            position: absolute;
            left: 20px;
            bottom: 13px;

            font-size: 12px;
            color: rgba(255, 255, 255, 0.28);

            pointer-events: none;
        }

        .send-thought-button {
            position: absolute;
            right: 12px;
            bottom: 10px;

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.25);

            cursor: default;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                transform 0.2s ease,
                box-shadow 0.25s ease;
        }

        .send-thought-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .send-thought-button:not(:disabled) {
            background: rgba(118, 87, 255, 0.22);
            color: rgba(255, 255, 255, 0.9);

            cursor: pointer;

            box-shadow:
                0 0 18px rgba(118, 87, 255, 0.15);
        }

        .send-thought-button:not(:disabled):hover {
            background: rgba(118, 87, 255, 0.35);
            color: #ffffff;

            transform: translateY(-1px);

            box-shadow:
                0 0 24px rgba(118, 87, 255, 0.25);
        }

        .send-thought-button:not(:disabled):active {
            transform: scale(0.94);
        }

        .countdown {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .closed {
            display: none;
        }

        .message {
            font-size: 22px;
            line-height: 1.5;
        }

        .loading {
            color: rgba(255, 255, 255, 0.65);
        }

        .error {
            color: #ffb3b3;
            font-size: 16px;
            line-height: 1.6;
            word-break: break-word;
        }

        .error-title {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .error-details {
            padding: 15px;
            margin-top: 15px;
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 150, 150, 0.2);
            border-radius: 12px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .question {
                font-size: 22px;
            }

            .card {
                padding: 28px 18px;
            }

            .answer-input {
                font-size: 16px;
            }

            .send-thought-button {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Анти-Шум</h1>

        <div class="subtitle">
            15 минут без информационного шума
        </div>

        <div id="activeScreen" class="card">

            <div class="time">
                Вопрос дня
            </div>

            <div
                class="question loading"
                id="questionText"
            >
                Загружаю вопрос...
            </div>

            <div class="answer-wrapper">

                <textarea
                    id="answerInput"
                    class="answer-input"
                    maxlength="500"
                    placeholder="Отправить мысль..."
                ></textarea>

                <div
                    class="answer-counter"
                    id="answerCounter"
                >
                    0 / 500
                </div>

                <button
                    class="send-thought-button"
                    id="answerButton"
                    onclick="submitAnswer()"
                    disabled
                    aria-label="Отправить мысль"
                    title="Отправить мысль"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21.8 3.2 2.6 10.4c-.8.3-.8 1.4 0 1.7l7.1 2.5 2.5 7.1c.3.8 1.4.8 1.7 0l7.2-19.2c.3-.8-.5-1.6-1.3-1.3ZM11 13.1l-6-2.1 13.7-5.2-7.7 7.3Zm2.2 5.8-1.9-5.3 7.4-7-5.5 12.3Z"/>
                    </svg>
                </button>

            </div>

            <div
                class="countdown"
                id="sessionTimer"
            >
                15:00
            </div>

        </div>

        <div
            id="closedScreen"
            class="card closed"
        >

            <div class="message">
                Время вышло! Спасибо, за твоё время!<br><br>
                Жду тебя завтра в 20:00!<br><br>
                Иди жить реальной жизнью!)
            </div>

            <div
                class="countdown"
                id="nextTimer"
            ></div>

        </div>

    </div>

    <script>
        /*
         * ==========================================
         * SUPABASE
         * ==========================================
         */


        const SUPABASE_URL =
            "https://mkyendzqoohqcwnycuys.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_wscrhaPifbezRTe4rWs-Wg_j0kGqktT";


        /*
         * ==========================================
         * НАСТРОЙКИ ПРОЕКТА
         * ==========================================
         */

        const PROJECT_START_DATE = null;

        const SESSION_MINUTES = 15;

        const SESSION_SECONDS =
            SESSION_MINUTES * 60;


        /*
         * ==========================================
         * ТЕСТОВЫЙ РЕЖИМ
         * ==========================================
         */

        const DEV_PROJECT_DAY = 1;


        /*
         * ==========================================
         * КЛЮЧИ LOCALSTORAGE
         * ==========================================
         */

        const DEV_SESSION_KEY =
            "antiShum_dev_session_start";

        const DEV_DAY_KEY =
            "antiShum_dev_project_day";


        /*
         * ==========================================
         * ПОЛУЧЕНИЕ ТЕКУЩЕГО ДНЯ ПРОЕКТА
         * ==========================================
         */

        function getProjectDay() {

            if (!PROJECT_START_DATE) {

                const savedDay =
                    localStorage.getItem(
                        DEV_DAY_KEY
                    );


                if (savedDay) {

                    const parsedDay =
                        Number(savedDay);


                    if (
                        Number.isInteger(parsedDay) &&
                        parsedDay > 0
                    ) {

                        return parsedDay;
                    }
                }


                return DEV_PROJECT_DAY;
            }


            const now = new Date();

            const start =
                new Date(
                    `${PROJECT_START_DATE}T20:00:00`
                );


            if (now < start) {
                return 0;
            }


            const difference =
                now.getTime() -
                start.getTime();


            const daysPassed =
                Math.floor(
                    difference / 86400000
                );


            return daysPassed + 1;
        }


        /*
         * ==========================================
         * ТЕКУЩИЙ ТЕСТОВЫЙ ДЕНЬ
         * ==========================================
         */

        function getDevProjectDay() {

            const savedDay =
                localStorage.getItem(
                    DEV_DAY_KEY
                );


            if (savedDay) {

                const parsedDay =
                    Number(savedDay);


                if (
                    Number.isInteger(parsedDay) &&
                    parsedDay > 0
                ) {

                    return parsedDay;
                }
            }


            return DEV_PROJECT_DAY;
        }


        /*
         * ==========================================
         * ПЕРЕХОД НА СЛЕДУЮЩИЙ ТЕСТОВЫЙ ДЕНЬ
         * ==========================================
         */

        function moveToNextDevDay() {

            if (PROJECT_START_DATE) {
                return;
            }


            const currentDay =
                getDevProjectDay();


            const nextDay =
                currentDay + 1;


            localStorage.setItem(
                DEV_DAY_KEY,
                String(nextDay)
            );


            localStorage.setItem(
                DEV_SESSION_KEY,
                String(Date.now())
            );


            sessionStorage.removeItem(
                "antiShum_dev_day_changed"
            );
        }


        /*
         * ==========================================
         * ВРЕМЯ ОТКРЫТИЯ ТЕКУЩЕГО ДНЯ
         * ==========================================
         */

        function getOpeningTime() {

            if (!PROJECT_START_DATE) {

                let saved =
                    localStorage.getItem(
                        DEV_SESSION_KEY
                    );


                if (!saved) {

                    saved =
                        String(Date.now());

                    localStorage.setItem(
                        DEV_SESSION_KEY,
                        saved
                    );
                }


                return Number(saved);
            }


            const now = new Date();

            const todayOpening =
                new Date(now);

            todayOpening.setHours(
                20,
                0,
                0,
                0
            );


            if (now < todayOpening) {

                todayOpening.setDate(
                    todayOpening.getDate() - 1
                );
            }


            return todayOpening.getTime();
        }


        /*
         * ==========================================
         * СОСТОЯНИЕ СЕССИИ
         * ==========================================
         */

        function getSessionState() {

            const now =
                Date.now();

            const opening =
                getOpeningTime();


            const elapsed =
                Math.floor(
                    (now - opening) / 1000
                );


            const remaining =
                SESSION_SECONDS - elapsed;


            return {
                opening,
                elapsed,
                remaining,
                active:
                    elapsed >= 0 &&
                    elapsed < SESSION_SECONDS
            };
        }


        /*
         * ==========================================
         * ЗАГРУЗКА ВОПРОСА
         * ==========================================
         */

        async function loadQuestion() {

            const questionElement =
                document.getElementById(
                    "questionText"
                );


            questionElement.classList.remove(
                "error"
            );

            questionElement.classList.add(
                "loading"
            );

            questionElement.textContent =
                "Загружаю вопрос...";


            try {

                const projectDay =
                    getProjectDay();


                if (projectDay === 0) {

                    questionElement.textContent =
                        "Анти-Шум ещё не начался.";

                    questionElement.classList.remove(
                        "loading"
                    );

                    return;
                }


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/questions?select=*&day=eq.${projectDay}`,
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );


                const responseText =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        `Supabase ${response.status}: ${responseText}`
                    );
                }


                const data =
                    JSON.parse(
                        responseText
                    );


                if (!data.length) {

                    throw new Error(
                        `Вопрос для дня ${projectDay} не найден.`
                    );
                }


                const question =
                    data[0];


                if (!question.question) {

                    throw new Error(
                        "У вопроса отсутствует текст."
                    );
                }


                questionElement.textContent =
                    question.question;


                questionElement.classList.remove(
                    "loading"
                );


            } catch (error) {

                console.error(
                    "Ошибка загрузки вопроса:",
                    error
                );


                questionElement.classList.remove(
                    "loading"
                );


                questionElement.classList.add(
                    "error"
                );


                questionElement.innerHTML = `
                    <div class="error-title">
                        Не удалось загрузить вопрос
                    </div>

                    <div class="error-details">
                        ${escapeHtml(error.message)}
                    </div>
                `;
            }
        }


        /*
         * ==========================================
         * ЗАЩИТА HTML
         * ==========================================
         */

        function escapeHtml(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /*
         * ==========================================
         * СЧЁТЧИК СИМВОЛОВ
         * ==========================================
         */

        const answerInput =
            document.getElementById(
                "answerInput"
            );

        const answerCounter =
            document.getElementById(
                "answerCounter"
            );

        const answerButton =
            document.getElementById(
                "answerButton"
            );


        answerInput.addEventListener(
            "input",
            function () {

                const length =
                    answerInput.value.length;


                answerCounter.textContent =
                    `${length} / 500`;


                answerButton.disabled =
                    answerInput.value.trim().length === 0;
            }
        );


        /*
         * ==========================================
         * ОТПРАВКА ОТВЕТА
         * ==========================================
         *
         * Пока это только интерфейсный тест.
         *
         * Реальное сохранение в Supabase
         * подключим следующим этапом.
         */

   function submitAnswer() {

    const text =
        answerInput.value.trim();


    if (!text) {
        return;
    }


    if (text.length > 500) {
        return;
    }


    const button =
        document.getElementById(
            "answerButton"
        );


    /*
     * Защита от повторного нажатия.
     */

    button.disabled = true;


    /*
     * Пока авторизация пользователя
     * ещё не подключена.
     *
     * Поэтому здесь только подготавливаем
     * ответ и передаём управление дальше.
     */

    console.log(
        "Ответ подготовлен:",
        text
    );


    finishSession();
}


/*
 * ==========================================
 * СЛЕДУЮЩИЕ 20:00
 * ==========================================
 */

function getNext20() {

    const now =
        new Date();


    const next =
        new Date(now);


    next.setHours(
        20,
        0,
        0,
        0
    );


    if (now >= next) {

        next.setDate(
            next.getDate() + 1
        );
    }


    return next;
}


/*
 * ==========================================
 * ТАЙМЕР ДО СЛЕДУЮЩЕГО ОТКРЫТИЯ
 * ==========================================
 */

function updateNextTimer() {

    const now =
        new Date();


    const next =
        getNext20();


    const diff =
        Math.max(
            0,
            next.getTime() -
            now.getTime()
        );


    const hours =
        Math.floor(
            diff / 3600000
        );


    const minutes =
        Math.floor(
            (diff % 3600000) / 60000
        );


    const seconds =
        Math.floor(
            (diff % 60000) / 1000
        );


    document.getElementById(
        "nextTimer"
    ).textContent =
        `До следующего открытия: ${
            String(hours).padStart(
                2,
                "0"
            )
        }:${
            String(minutes).padStart(
                2,
                "0"
            )
        }:${
            String(seconds).padStart(
                2,
                "0"
            )
        }`;
}


/*
 * ==========================================
 * ЗАКРЫТИЕ САЙТА
 * ==========================================
 */

function finishSession() {

    document
        .getElementById(
            "activeScreen"
        )
        .classList.add(
            "closed"
        );


    document
        .getElementById(
            "closedScreen"
        )
        .classList.remove(
            "closed"
        );


    updateNextTimer();
}


/*
 * ==========================================
 * ТАЙМЕР 15 МИНУТ
 * ==========================================
 */

function updateSessionTimer() {

    const state =
        getSessionState();


    if (!state.active) {

        finishSession();

        return;
    }


    const remaining =
        state.remaining;


    const minutes =
        Math.floor(
            remaining / 60
        );


    const seconds =
        remaining % 60;


    document.getElementById(
        "sessionTimer"
    ).textContent =
        `${String(minutes).padStart(
            2,
            "0"
        )}:${
            String(seconds).padStart(
                2,
                "0"
            )
        }`;
}


/*
 * ==========================================
 * ПРОВЕРКА НОВОГО ДНЯ
 * ==========================================
 */

let currentProjectDay =
    getProjectDay();


function checkForNewDay() {

    const newProjectDay =
        getProjectDay();


    if (
        newProjectDay !==
            currentProjectDay &&
        newProjectDay > 0
    ) {

        currentProjectDay =
            newProjectDay;


        loadQuestion();
    }


    /*
     * Тестовый переход.
     */

    if (!PROJECT_START_DATE) {

        const state =
            getSessionState();


        if (
            !state.active &&
            !sessionStorage.getItem(
                "antiShum_dev_day_changed"
            )
        ) {

            sessionStorage.setItem(
                "antiShum_dev_day_changed",
                "true"
            );


            moveToNextDevDay();


            currentProjectDay =
                getProjectDay();


            loadQuestion();
        }
    }


    const state =
        getSessionState();


    if (state.active) {

        document
            .getElementById(
                "activeScreen"
            )
            .classList.remove(
                "closed"
            );


        document
            .getElementById(
                "closedScreen"
            )
            .classList.add(
                "closed"
            );
    }
}


/*
 * ==========================================
 * ПЕРВЫЙ ЗАПУСК
 * ==========================================
 */

function initialize() {

    loadQuestion();


    const state =
        getSessionState();


    if (state.active) {

        document
            .getElementById(
                "activeScreen"
            )
            .classList.remove(
                "closed"
            );


        document
            .getElementById(
                "closedScreen"
            )
            .classList.add(
                "closed"
            );

    } else {

        finishSession();
    }


    updateSessionTimer();

    updateNextTimer();
}


/*
 * ==========================================
 * ЗАПУСК
 * ==========================================
 */

initialize();


/*
 * Обновление таймера каждую секунду.
 */

setInterval(
    updateSessionTimer,
    1000
);


/*
 * Обновление таймера до следующего дня.
 */

setInterval(
    updateNextTimer,
    1000
);


/*
 * Проверка смены дня.
 */

setInterval(
    checkForNewDay,
    1000
);
