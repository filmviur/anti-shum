<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анти-Шум</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(89, 55, 180, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 150, 180, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #090914,
                    #111126 50%,
                    #07151c
                );

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 15px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .time {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 15px;
        }

        .question {
            font-size: 26px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-size: 17px;
            cursor: pointer;
            color: white;
            background: linear-gradient(
                135deg,
                #7657ff,
                #3aa8ff
            );
            transition:
                transform 0.2s,
                opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .countdown {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .closed {
            display: none;
        }

        .message {
            font-size: 22px;
            line-height: 1.5;
        }

        .loading {
            color: rgba(255, 255, 255, 0.65);
        }

        .error {
            color: #ffb3b3;
            font-size: 16px;
            line-height: 1.6;
            word-break: break-word;
        }

        .error-title {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .error-details {
            padding: 15px;
            margin-top: 15px;
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 150, 150, 0.2);
            border-radius: 12px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .question {
                font-size: 22px;
            }

            .card {
                padding: 28px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Анти-Шум</h1>

        <div class="subtitle">
            15 минут без информационного шума
        </div>

        <div id="activeScreen" class="card">

            <div class="time">
                Сегодняшний вопрос
            </div>

            <div
                class="question loading"
                id="questionText"
            >
                Загружаю вопрос...
            </div>

            <button onclick="finishSession()">
                Я ответил
            </button>

            <div
                class="countdown"
                id="sessionTimer"
            >
                15:00
            </div>

        </div>

        <div
            id="closedScreen"
            class="card closed"
        >

            <div class="message">
                Время вышло! Спасибо, за твоё время!<br><br>
                Жду тебя завтра в 20:00!<br><br>
                Иди жить реальной жизнью!)
            </div>

            <div
                class="countdown"
                id="nextTimer"
            ></div>

        </div>

    </div>

    <script>
        /*
         * ==========================================
         * SUPABASE
         * ==========================================
         */

        const SUPABASE_URL =
            "https://mkyendzqoohqcwnycuys.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_wscrhaPifbezRTe4rWs-Wg_j0kGqktT";


        /*
         * ==========================================
         * НАСТРОЙКИ ПРОЕКТА
         * ==========================================
         *
         * Пока дата NULL — режим разработки.
         *
         * В этом режиме:
         * - используется вопрос №1;
         * - 15 минут начинаются при первом открытии;
         * - обновление страницы НЕ сбрасывает таймер.
         *
         * Когда будем запускать проект:
         *
         * const PROJECT_START_DATE = "2026-XX-XX";
         *
         * Тогда каждый день будет открываться
         * автоматически ровно в 20:00.
         */

        const PROJECT_START_DATE = null;

        const SESSION_MINUTES = 15;

        const SESSION_SECONDS =
            SESSION_MINUTES * 60;


        /*
         * ==========================================
         * КЛЮЧ ДЛЯ РЕЖИМА РАЗРАБОТКИ
         * ==========================================
         */

        const DEV_SESSION_KEY =
            "antiShum_dev_session_start";


        /*
         * ==========================================
         * ПОЛУЧЕНИЕ ТЕКУЩЕГО ДНЯ ПРОЕКТА
         * ==========================================
         */

        function getProjectDay() {

            /*
             * Режим разработки.
             */
            if (!PROJECT_START_DATE) {
                return 1;
            }


            const now = new Date();

            const start =
                new Date(
                    `${PROJECT_START_DATE}T20:00:00`
                );


            /*
             * До запуска проекта.
             */
            if (now < start) {
                return 0;
            }


            const difference =
                now.getTime() -
                start.getTime();


            const daysPassed =
                Math.floor(
                    difference / 86400000
                );


            return daysPassed + 1;
        }


        /*
         * ==========================================
         * ВРЕМЯ ОТКРЫТИЯ ТЕКУЩЕГО ДНЯ
         * ==========================================
         */

        function getOpeningTime() {

            /*
             * Режим разработки:
             * начало сессии сохраняется в localStorage.
             */
            if (!PROJECT_START_DATE) {

                let saved =
                    localStorage.getItem(
                        DEV_SESSION_KEY
                    );


                if (!saved) {

                    saved =
                        String(Date.now());

                    localStorage.setItem(
                        DEV_SESSION_KEY,
                        saved
                    );
                }


                return Number(saved);
            }


            /*
             * Настоящий режим.
             *
             * Каждый день открывается в 20:00.
             */

            const now = new Date();

            const todayOpening =
                new Date(now);

            todayOpening.setHours(
                20,
                0,
                0,
                0
            );


            /*
             * Если сейчас раньше 20:00,
             * текущий цикл начался вчера.
             */
            if (now < todayOpening) {

                todayOpening.setDate(
                    todayOpening.getDate() - 1
                );
            }


            return todayOpening.getTime();
        }


        /*
         * ==========================================
         * СОСТОЯНИЕ ТЕКУЩЕЙ СЕССИИ
         * ==========================================
         */

        function getSessionState() {

            const now =
                Date.now();

            const opening =
                getOpeningTime();


            const elapsed =
                Math.floor(
                    (now - opening) / 1000
                );


            const remaining =
                SESSION_SECONDS - elapsed;


            return {
                opening,
                elapsed,
                remaining,
                active:
                    elapsed >= 0 &&
                    elapsed < SESSION_SECONDS
            };
        }


        /*
         * ==========================================
         * ЗАГРУЗКА ВОПРОСА
         * ==========================================
         */

        async function loadQuestion() {

            const questionElement =
                document.getElementById(
                    "questionText"
                );


            try {

                const projectDay =
                    getProjectDay();


                /*
                 * Проект ещё не запущен.
                 */
                if (projectDay === 0) {

                    questionElement.textContent =
                        "Анти-Шум ещё не начался.";

                    questionElement.classList.remove(
                        "loading"
                    );

                    return;
                }


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/questions?select=*&day=eq.${projectDay}`,
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );


                const responseText =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        `Supabase ${response.status}: ${responseText}`
                    );
                }


                const data =
                    JSON.parse(
                        responseText
                    );


                if (!data.length) {

                    throw new Error(
                        `Вопрос для дня ${projectDay} не найден.`
                    );
                }


                const question =
                    data[0];


                if (!question.question) {

                    throw new Error(
                        "У вопроса отсутствует текст."
                    );
                }


                questionElement.textContent =
                    question.question;


                questionElement.classList.remove(
                    "loading"
                );


            } catch (error) {

                console.error(
                    "Ошибка загрузки вопроса:",
                    error
                );


                questionElement.classList.remove(
                    "loading"
                );


                questionElement.classList.add(
                    "error"
                );


                questionElement.innerHTML = `
                    <div class="error-title">
                        Не удалось загрузить вопрос
                    </div>

                    <div class="error-details">
                        ${escapeHtml(error.message)}
                    </div>
                `;
            }
        }


        /*
         * ==========================================
         * ЗАЩИТА HTML
         * ==========================================
         */

        function escapeHtml(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /*
         * ==========================================
         * СЛЕДУЮЩИЕ 20:00
         * ==========================================
         */

        function getNext20() {

            const now =
                new Date();


            const next =
                new Date(now);


            next.setHours(
                20,
                0,
                0,
                0
            );


            if (now >= next) {

                next.setDate(
                    next.getDate() + 1
                );
            }


            return next;
        }


        /*
         * ==========================================
         * ТАЙМЕР ДО СЛЕДУЮЩЕГО ОТКРЫТИЯ
         * ==========================================
         */

        function updateNextTimer() {

            const now =
                new Date();


            const next =
                getNext20();


            const diff =
                Math.max(
                    0,
                    next.getTime() -
                    now.getTime()
                );


            const hours =
                Math.floor(
                    diff / 3600000
                );


            const minutes =
                Math.floor(
                    (diff % 3600000) / 60000
                );


            const seconds =
                Math.floor(
                    (diff % 60000) / 1000
                );


            document.getElementById(
                "nextTimer"
            ).textContent =
                `До следующего открытия: ${
                    String(hours).padStart(
                        2,
                        "0"
                    )
                }:${
                    String(minutes).padStart(
                        2,
                        "0"
                    )
                }:${
                    String(seconds).padStart(
                        2,
                        "0"
                    )
                }`;
        }


        /*
         * ==========================================
         * ЗАКРЫТИЕ САЙТА
         * ==========================================
         */

        function finishSession() {

            document
                .getElementById(
                    "activeScreen"
                )
                .classList.add(
                    "closed"
                );


            document
                .getElementById(
                    "closedScreen"
                )
                .classList.remove(
                    "closed"
                );


            updateNextTimer();
        }


        /*
         * ==========================================
         * ТАЙМЕР 15 МИНУТ
         * ==========================================
         */

        function updateSessionTimer() {

            const state =
                getSessionState();


            /*
             * 15 минут закончились.
             */
            if (!state.active) {

                finishSession();

                return;
            }


            const remaining =
                state.remaining;


            const minutes =
                Math.floor(
                    remaining / 60
                );


            const seconds =
                remaining % 60;


            document.getElementById(
                "sessionTimer"
            ).textContent =
                `${String(minutes).padStart(
                    2,
                    "0"
                )}:${
                    String(seconds).padStart(
                        2,
                        "0"
                    )
                }`;
        }


        /*
         * ==========================================
         * ПРОВЕРКА НОВОГО ДНЯ
         * ==========================================
         */

        let currentProjectDay =
            getProjectDay();


        function checkForNewDay() {

            const newProjectDay =
                getProjectDay();


            /*
             * Новый день проекта.
             */
            if (
                newProjectDay !==
                    currentProjectDay &&
                newProjectDay > 0
            ) {

                currentProjectDay =
                    newProjectDay;


                /*
                 * Загружаем новый вопрос.
                 */
                loadQuestion();


                /*
                 * Проверяем состояние
                 * новой 15-минутной сессии.
                 */
                updateSessionTimer();
            }


            /*
             * Если сейчас 20:00 и начался
             * новый 15-минутный период —
             * показываем активный экран.
             */
            const state =
                getSessionState();


            if (state.active) {

                document
                    .getElementById(
                        "activeScreen"
                    )
                    .classList.remove(
                        "closed"
                    );


                document
                    .getElementById(
                        "closedScreen"
                    )
                    .classList.add(
                        "closed"
                    );
            }
        }


        /*
         * ==========================================
         * ПЕРВЫЙ ЗАПУСК
         * ==========================================
         */

        function initialize() {

            loadQuestion();


            const state =
                getSessionState();


            /*
             * Если 15 минут ещё идут —
             * показываем вопрос.
             */
            if (state.active) {

                document
                    .getElementById(
                        "activeScreen"
                    )
                    .classList.remove(
                        "closed"
                    );


                document
                    .getElementById(
                        "closedScreen"
                    )
                    .classList.add(
                        "closed"
                    );

            } else {

                /*
                 * Если 15 минут уже закончились —
                 * показываем экран окончания.
                 */

                finishSession();
            }


            updateSessionTimer();

            updateNextTimer();
        }


        /*
         * ==========================================
         * ЗАПУСК
         * ==========================================
         */

        initialize();


        /*
         * Обновление таймера каждую секунду.
         */

        setInterval(
            updateSessionTimer,
            1000
        );


        /*
         * Обновление таймера до следующего дня.
         */

        setInterval(
            updateNextTimer,
            1000
        );


        /*
         * Проверка смены дня.
         */

        setInterval(
            checkForNewDay,
            1000
        );
    </script>

</body>
</html>
